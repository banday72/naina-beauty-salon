<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAINA Owner Dashboard</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#fdf8f5;color:#2e2626;margin:0;padding:24px}
    main{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
    h1{font-family:Georgia,serif;font-weight:400}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
    .card,section{background:#fff;border:1px solid #eadfe0;border-radius:12px;padding:18px}.value{font-size:1.7rem;color:#a55570}
    table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}
    button{border:0;border-radius:8px;padding:9px 12px;background:#a55570;color:white;cursor:pointer}
    select{padding:7px;border:1px solid #ddd;border-radius:6px}.muted{color:#7a6b6b}
    @media(max-width:700px){body{padding:12px}.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><p class="muted">NAINA Beauty Salon</p><h1>Owner Dashboard</h1></div><div><button id="login">Login</button> <button id="logout" hidden>Logout</button></div></div>
  <p id="message" class="muted">Log in with your Netlify Identity owner account.</p>
  <div id="dashboard" hidden>
    <div class="cards"><div class="card">Revenue<div id="revenue" class="value">PKR 0</div></div><div class="card">Paid<div id="paid" class="value">PKR 0</div></div><div class="card">Pending bookings<div id="pending" class="value">0</div></div></div>
    <section><h2>Bookings</h2><table><thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Time</th><th>Amount</th><th>Staff</th><th>Status</th></tr></thead><tbody id="bookings"></tbody></table></section>
    <section><h2>Customers</h2><table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th></tr></thead><tbody id="customers"></tbody></table></section>
    <section><h2>Services</h2><table><thead><tr><th>Name</th><th>Duration</th><th>Price (PKR)</th><th>Active</th></tr></thead><tbody id="services"></tbody></table></section>
  </div>
</main>
<script>
  const fmt = n => `PKR ${Number(n || 0).toLocaleString('en-PK')}`;
  const identity = window.netlifyIdentity;
  const message = document.getElementById('message');
  async function load() {
    const user = identity.currentUser();
    if (!user) return;
    const token = await user.jwt();
    const response = await fetch('/api/admin', {headers:{Authorization:`Bearer ${token}`}});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Could not load dashboard');
    document.getElementById('dashboard').hidden = false;
    document.getElementById('login').hidden = true; document.getElementById('logout').hidden = false;
    document.getElementById('revenue').textContent = fmt(data.summary.revenue);
    document.getElementById('paid').textContent = fmt(data.summary.paid);
    document.getElementById('pending').textContent = data.summary.pendingBookings;
    document.getElementById('bookings').innerHTML = data.bookings.map(b => `<tr><td>${b.date}</td><td>${b.name}<br><span class="muted">${b.phone}</span></td><td>${b.service}</td><td>${b.timeFrom}–${b.timeTo}</td><td>${fmt(b.amount)}</td><td><select data-id="${b.id}" class="staff"><option value="">Unassigned</option>${data.staff.map(s => `<option value="${s.id}" ${s.id===b.staffId?'selected':''}>${s.name}</option>`).join('')}</select></td><td><select data-id="${b.id}" class="status"><option ${b.status==='pending'?'selected':''}>pending</option><option ${b.status==='confirmed'?'selected':''}>confirmed</option><option ${b.status==='completed'?'selected':''}>completed</option><option ${b.status==='cancelled'?'selected':''}>cancelled</option><option ${b.status==='no_show'?'selected':''}>no_show</option></select></td></tr>`).join('');
    document.getElementById('customers').innerHTML = data.customers.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${String(c.createdAt || '').slice(0,10)}</td></tr>`).join('');
    document.getElementById('services').innerHTML = data.services.map(s => `<tr><td>${s.name}</td><td>${s.durationMins} min</td><td>${fmt(s.price)}</td><td>${s.active?'Yes':'No'}</td></tr>`).join('');
    document.querySelectorAll('.status').forEach(select => select.addEventListener('change', async e => {
      const token = await identity.currentUser().jwt();
      await fetch('/api/admin', {method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({resource:'booking',id:Number(e.target.dataset.id),status:e.target.value})});
    }));
    document.querySelectorAll('.staff').forEach(select => select.addEventListener('change', async e => {
      const token = await identity.currentUser().jwt();
      await fetch('/api/admin', {method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({resource:'booking',id:Number(e.target.dataset.id),staffId:e.target.value ? Number(e.target.value) : null})});
    }));
    message.textContent = `Signed in as ${user.email}`;
  }
  document.getElementById('login').onclick = () => identity.open('login');
  document.getElementById('logout').onclick = () => identity.logout();
  identity.on('login', load); identity.on('logout', () => location.reload());
  load().catch(error => message.textContent = error.message);
</script>
</body>
</html>
